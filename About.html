<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        color: #333;
        line-height: 1.6;
      }
      h2 {
        color: #4285f4;
        margin-top: 0;
      }
      pre {
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 4px;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        border: 1px solid #dadce0;
        margin: 0;
      }
      .footer {
        margin-top: 20px;
        text-align: right;
      }
      button {
        padding: 8px 20px;
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Scroll down to see the the entire changelog</h2>
    <div id="content">
      <pre><?= content ?></pre>
    </div>
    <div class="footer">
      <button onclick="google.script.host.close()">Close</button>
    </div>
  </body>
</html>
